name: aquaapp_frontend
description: Cliente web de Aquaapp (gestión de embalses) hecho con Flutter Web.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.5.0
  http: ^1.6.0
  intl: ^0.20.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/aquaapp-logo-horizontal.svg
    - assets/i18n/
  # Roboto (Apache 2.0, ver assets/fonts/Roboto_LICENSE.txt) va incluida en la app:
  # así la web no la descarga de Google Fonts.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
