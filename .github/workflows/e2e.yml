# Pruebas de sistema (Playwright) de los tres clientes de aquaapp.
#
# Para cada framework de la matriz: levanta el backend y auth a partir de las
# imágenes PRIVADAS que publica en GHCR el repositorio del backend
# (docker-compose.backend.yml), construye la imagen del cliente con el Dockerfile de
# este repositorio, lo levanta y ejecuta la suite de E2E/ contra él. Así, un PR de
# Dependabot que actualiza dependencias o imágenes base también compila y se prueba.
#
# Acceso a las imágenes (paso manual, una sola vez; no se puede hacer por API ni desde
# un workflow): en los ajustes de CADA paquete (aquaapp-backend y aquaapp-auth) >
# "Manage Actions access" > "Add repository" > SOLO este repositorio (frameworks-examples),
# rol Read. Con eso basta el GITHUB_TOKEN del workflow (permissions: packages: read),
# también en los PRs de Dependabot. No hace falta ningún PAT.
#
# Opcional (no recomendado): el secreto GHCR_TOKEN, si existe, se usa en lugar de
# GITHUB_TOKEN. Un PAT clásico con read:packages da lectura a TODOS los paquetes del
# usuario; si se usa, créalo también en Settings > Secrets and variables > Dependabot.
# Variables de repositorio opcionales: BACKEND_IMAGE y AUTH_IMAGE (si no existen, se
# usan los valores por defecto de docker-compose.backend.yml).
name: E2E

on:
  pull_request:
    paths-ignore: ["**.md"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: e2e (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        framework: [angular, react, flutter]
    steps:
      - name: Checkout de este repositorio
        uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Crea la red aquaapp-network; el backend declara healthcheck, así que --wait
      # devuelve el control cuando está listo. Una variable vacía cae al valor por defecto.
      - name: Levantar backend y autenticación
        env:
          BACKEND_IMAGE: ${{ vars.BACKEND_IMAGE }}
          AUTH_IMAGE: ${{ vars.AUTH_IMAGE }}
        run: docker compose -f docker-compose.backend.yml up -d --wait

      # Construye la imagen del cliente a partir de su Dockerfile y lo levanta solo a él.
      - name: Construir y levantar el cliente (${{ matrix.framework }})
        run: docker compose up -d --build --wait ${{ matrix.framework }}

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: E2E/package-lock.json

      - name: Instalar dependencias de E2E
        working-directory: E2E
        run: npm ci

      - name: Instalar Chromium de Playwright
        working-directory: E2E
        run: npx playwright install --with-deps chromium

      - name: Ejecutar las pruebas (${{ matrix.framework }})
        working-directory: E2E
        env:
          CI: "true"
        run: npx playwright test --project=${{ matrix.framework }}

      - name: Subir informe y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.framework }}
          path: |
            E2E/playwright-report
            E2E/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Logs de los contenedores
        if: failure()
        run: |
          docker compose logs --no-color
          docker compose -f docker-compose.backend.yml logs --no-color

      - name: Limpieza
        if: always()
        run: |
          docker compose down -v
          docker compose -f docker-compose.backend.yml down -v
